# macOS Apple Silicon 未公证包。
# 触发：推送 v* tag，或 Actions 里手动 Run workflow。
# 产物：dist/RyuuMD-mac-arm64.zip（无签名，用户需右键打开）。
name: macOS 打包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build .app and zip
        run: bash build-mac.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyuuMD-mac-arm64
          path: dist/RyuuMD-mac-*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RyuuMD-mac-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
