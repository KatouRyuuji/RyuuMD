# 持续集成：PR 与 master 推送时做静态检查 + 双平台构建冒烟。
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AI_GUIDE.md"
      - "LICENSE"
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AI_GUIDE.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: 版本号一致性
        run: python scripts/check_version.py

      - name: Python 语法编译
        run: python -m compileall -q main.py run_tests.py make_icon.py app tests scripts

      - name: Ruff（只拦真实错误：语法错误、未定义名称等）
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 --target-version py310 --exclude app/web/vendor --output-format github .

      - name: 前端 JS 语法检查
        run: |
          for f in app/web/js/*.js tests/dev/*.js; do
            node --check "$f"
          done

      - name: 工作流配置检查（actionlint）
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  build:
    name: 构建
    needs: lint
    uses: ./.github/workflows/build.yml
    with:
      release: false
      retention-days: 7
