<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RyuuMD</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="vendor/vditor/dist/index.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/editor-theme.css" />
  <link rel="stylesheet" href="css/slash.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部工具条 -->
    <div id="toolbar">
      <div class="tb-title">
        <span class="logo">md</span>
        <span>RyuuMD</span>
      </div>
      <!-- 图标放在 .ib-icon（data-icon 注入目标）里，文字放 .ib-label，互不覆盖 -->
      <button class="icon-btn" id="btn-home" title="首页 (Ctrl+Shift+H)"><span class="ib-icon" data-icon="home"></span><span class="ib-label">首页</span></button>
      <button class="icon-btn" id="btn-sidebar" title="切换侧栏 (Ctrl+B)"><span class="ib-icon" data-icon="sidebar"></span><span class="ib-label">侧栏</span></button>
      <button class="icon-btn" id="btn-open-folder" title="打开文件夹"><span class="ib-icon" data-icon="folder"></span><span class="ib-label">打开文件夹</span></button>
      <button class="icon-btn" id="btn-open-file" title="打开文件 (Ctrl+O)"><span class="ib-icon" data-icon="file"></span><span class="ib-label">打开文件</span></button>
      <button class="icon-btn" id="btn-new" title="新建 (Ctrl+N)"><span class="ib-icon" data-icon="plus"></span><span class="ib-label">新建</span></button>
      <button class="icon-btn" id="btn-save" title="保存 (Ctrl+S)"><span class="ib-icon" data-icon="save"></span><span class="ib-label">保存</span></button>

      <div class="tb-spacer"></div>

      <span class="tb-doc-name" id="doc-name">未打开文件</span>
      <button class="icon-btn" id="btn-theme" title="切换主题"><span class="ib-icon" data-icon="moon"></span><span class="ib-label">主题</span></button>
      <button class="icon-btn" id="btn-settings" title="设置"><span class="ib-icon" data-icon="gear"></span><span class="ib-label">设置</span></button>
    </div>

    <!-- 主体 -->
    <div id="body">
      <aside id="sidebar">
        <div class="side-tabs">
          <button class="side-tab active" data-panel="files">目录</button>
          <button class="side-tab" data-panel="outline">大纲</button>
          <button class="side-tab" data-panel="recent">最近</button>
        </div>
        <div class="side-panel active" id="panel-files">
          <div class="side-empty" id="files-empty">
            还没有打开文件夹<br />
            <button class="btn" id="empty-open-folder">打开文件夹</button>
          </div>
          <div id="file-tree"></div>
        </div>
        <div class="side-panel" id="panel-outline">
          <div class="side-empty" id="outline-empty">大纲将在这里显示</div>
          <div id="outline-list"></div>
        </div>
        <div class="side-panel" id="panel-recent">
          <div class="side-empty" id="recent-empty">最近打开的文件和文件夹<br />会显示在这里</div>
          <div id="recent-list"></div>
          <div class="recent-foot" id="recent-foot" style="display:none">
            <button class="btn btn-ghost" id="btn-clear-recent">清空列表</button>
          </div>
        </div>
      </aside>

      <main id="editor-wrap">
        <div id="editor"></div>
        <div id="statusbar">
          <div class="sb-left">
            <span id="sb-path" class="sb-item">未打开文件</span>
          </div>
          <div class="sb-right">
            <span id="sb-count" class="sb-item">0 字</span>
            <div class="sb-modes" id="sb-modes">
              <button class="sb-mode active" data-mode="ir">渲染</button>
              <button class="sb-mode" data-mode="sv">源码</button>
            </div>
          </div>
        </div>
      </main>

      <!-- 首页（覆盖在编辑器之上） -->
      <div id="home">
        <div class="home-inner">
          <header class="home-hero">
            <h1 id="home-greet">你好</h1>
            <p class="home-sub">RyuuMD · 轻量、全本地、极速的 Markdown 笔记</p>
            <div class="home-quick">
              <button class="quick-card" id="hq-new">
                <span class="qc-icon" data-icon="plus"></span>
                <span>新建文档<span class="qc-desc">开始记录新想法</span></span>
              </button>
              <button class="quick-card" id="hq-open-file">
                <span class="qc-icon" data-icon="file"></span>
                <span>打开文件<span class="qc-desc">浏览单个 Markdown</span></span>
              </button>
              <button class="quick-card" id="hq-add-repo">
                <span class="qc-icon" data-icon="folder"></span>
                <span>添加仓库<span class="qc-desc">把目录作为笔记仓库</span></span>
              </button>
            </div>
          </header>

          <section class="home-section">
            <div class="home-sec-head">
              <h2><span data-icon="books"></span>我的仓库 <span class="home-sec-count" id="repo-count"></span></h2>
              <div class="home-sec-spacer"></div>
              <div class="view-toggle" id="repo-view-toggle">
                <button data-view="card" title="卡片视图" data-icon="grid"></button>
                <button data-view="list" title="列表视图" data-icon="listView"></button>
              </div>
            </div>
            <div id="repo-container" class="repo-grid"></div>
            <div class="home-empty" id="repo-empty" style="display:none">
              还没有仓库。仓库是你的笔记目录，添加后可在首页一键切换。<br />
              <button class="btn btn-primary" id="repo-empty-add">添加第一个仓库</button>
            </div>
          </section>

          <section class="home-section">
            <div class="home-sec-head">
              <h2><span data-icon="clock"></span>最近打开</h2>
              <div class="home-sec-spacer"></div>
              <button class="btn btn-ghost" id="home-clear-recent">清空</button>
            </div>
            <div id="home-recent" class="home-recent"></div>
            <div class="home-empty" id="home-recent-empty" style="display:none">最近打开的文件和文件夹会显示在这里</div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- 斜杠菜单 -->
  <div id="slash-menu"></div>

  <!-- 拖放提示 -->
  <div id="drop-hint"><div class="inner">松开以打开 Markdown 文件或文件夹</div></div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- 弹窗挂载点 -->
  <div class="modal-mask" id="settings-mask"></div>
  <div class="modal-mask" id="welcome-mask"></div>
  <div class="modal-mask" id="home-modal-mask"></div>

  <script src="vendor/vditor/dist/index.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/slash.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/welcome.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/home.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
