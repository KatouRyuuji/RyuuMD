<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-palette="sky">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RyuuMD</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="vendor/vditor/dist/index.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/editor-theme.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/slash.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/palette.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部工具条 -->
    <div id="toolbar">
      <div class="tb-title">
        <span class="logo">md</span>
        <span>RyuuMD</span>
      </div>
      <!-- 图标放在 .ib-icon（data-icon 注入目标）里，文字放 .ib-label，互不覆盖 -->
      <button class="icon-btn" id="btn-home" title="首页 (Ctrl+Shift+H)" aria-label="首页"><span class="ib-icon" data-icon="home"></span><span class="ib-label">首页</span></button>
      <button class="icon-btn" id="btn-sidebar" title="切换侧栏 (Ctrl+Shift+B)" aria-label="切换侧栏"><span class="ib-icon" data-icon="sidebar"></span><span class="ib-label">侧栏</span></button>
      <button class="icon-btn" id="btn-open-folder" title="打开文件夹" aria-label="打开文件夹"><span class="ib-icon" data-icon="folder"></span><span class="ib-label">打开文件夹</span></button>
      <button class="icon-btn" id="btn-open-file" title="打开文件 (Ctrl+O)" aria-label="打开文件"><span class="ib-icon" data-icon="file"></span><span class="ib-label">打开文件</span></button>
      <button class="icon-btn" id="btn-new" title="新建 (Ctrl+N)" aria-label="新建"><span class="ib-icon" data-icon="plus"></span><span class="ib-label">新建</span></button>
      <button class="icon-btn" id="btn-save" title="保存 (Ctrl+S)" aria-label="保存"><span class="ib-icon" data-icon="save"></span><span class="ib-label">保存</span></button>
      <button class="icon-btn" id="btn-search" title="搜索 (Ctrl+Shift+F)" aria-label="搜索"><span class="ib-icon" data-icon="search"></span><span class="ib-label">搜索</span></button>
      <button class="icon-btn" id="btn-new-window" title="打开新窗口" aria-label="打开新窗口"><span class="ib-icon" data-icon="newWindow"></span><span class="ib-label">新窗口</span></button>

      <div class="tb-spacer"></div>

      <span class="tb-doc-name" id="doc-name">未打开文件</span>
      <button class="icon-btn" id="btn-theme" title="切换主题 (Ctrl+Shift+L)" aria-label="切换主题"><span class="ib-icon" data-icon="moon"></span><span class="ib-label">主题</span></button>
      <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置"><span class="ib-icon" data-icon="gear"></span><span class="ib-label">设置</span></button>
    </div>

    <!-- 主体 -->
    <div id="body">
      <aside id="sidebar">
        <div class="side-tabs">
          <button class="side-tab active" data-panel="files" aria-label="目录">目录</button>
          <button class="side-tab" data-panel="outline" aria-label="大纲">大纲</button>
          <button class="side-tab" data-panel="recent" aria-label="最近">最近</button>
          <button class="side-tab" data-panel="links" aria-label="链接">链接</button>
        </div>
        <div class="side-panel active" id="panel-files">
          <div class="side-empty" id="files-empty">
            还没有打开文件夹<br />
            <button class="btn" id="empty-open-folder">打开文件夹</button>
          </div>
          <div id="file-tree"></div>
        </div>
        <div class="side-panel" id="panel-outline">
          <div class="side-empty" id="outline-empty">大纲将在这里显示</div>
          <div id="outline-list"></div>
        </div>
        <div class="side-panel" id="panel-recent">
          <div class="side-empty" id="recent-empty">最近打开的文件和文件夹<br />会显示在这里</div>
          <div id="recent-list"></div>
          <div class="recent-foot" id="recent-foot" style="display:none">
            <button class="btn btn-ghost" id="btn-clear-recent">清空列表</button>
          </div>
        </div>
        <div class="side-panel" id="panel-links">
          <div class="side-empty" id="links-empty">打开一篇笔记后，这里显示指向它的双向链接</div>
          <div id="links-list"></div>
        </div>
      </aside>
      <div id="sidebar-resizer" title="拖拽调整侧栏宽度，双击恢复默认" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>

      <main id="editor-wrap">
        <div id="find-bar">
          <div class="find-row">
            <input id="find-input" placeholder="在本文查找" spellcheck="false" />
            <span id="find-count"></span>
            <button type="button" class="btn" id="find-prev">上一个</button>
            <button type="button" class="btn" id="find-next">下一个</button>
            <button type="button" class="btn" id="find-toggle-replace" title="替换 (Ctrl+H)">替换</button>
            <button type="button" class="btn" id="find-close">关闭</button>
          </div>
          <div class="find-row" id="replace-row">
            <input id="replace-input" placeholder="替换为" spellcheck="false" />
            <button type="button" class="btn" id="replace-one">替换</button>
            <button type="button" class="btn" id="replace-all">全部替换</button>
          </div>
        </div>
        <div id="editor"></div>
        <div id="statusbar">
          <div class="sb-left">
            <span id="sb-path" class="sb-item" title="在目录中定位">未打开文件</span>
          </div>
          <div class="sb-right">
            <span id="sb-count" class="sb-item">0 字</span>
            <button type="button" class="sb-item" id="sb-zoom" title="Ctrl+= 放大 / Ctrl+- 缩小 / Ctrl+0 重置">100%</button>
            <button type="button" class="sb-item sb-cloud" id="sb-cloud" title="云同步" style="display:none">云同步</button>
            <div class="sb-views" id="sb-views">
              <button type="button" class="sb-view" id="sb-readable" data-icon="readable" title="可读宽度" aria-label="可读宽度" aria-pressed="false"></button>
              <button type="button" class="sb-view" id="sb-focus" data-icon="focus" title="专注模式" aria-label="专注模式" aria-pressed="false"></button>
              <button type="button" class="sb-view" id="sb-typewriter" data-icon="typewriter" title="打字机模式" aria-label="打字机模式" aria-pressed="false"></button>
            </div>
            <div class="sb-modes" id="sb-modes">
              <button class="sb-mode active" data-mode="ir">渲染</button>
              <button class="sb-mode" data-mode="sv">源码</button>
            </div>
          </div>
        </div>
      </main>

      <!-- 首页（覆盖在编辑器之上） -->
      <div id="home">
        <div class="home-inner">
          <header class="home-hero">
            <h1 id="home-greet">你好</h1>
            <p class="home-sub">RyuuMD · 轻量、全本地、极速的 Markdown 笔记</p>
            <div class="home-quick">
              <button class="quick-card" id="hq-new">
                <span class="qc-icon" data-icon="plus"></span>
                <span>新建文档<span class="qc-desc">开始记录新想法</span></span>
              </button>
              <button class="quick-card" id="hq-open-file">
                <span class="qc-icon" data-icon="file"></span>
                <span>打开文件<span class="qc-desc">浏览单个 Markdown</span></span>
              </button>
              <button class="quick-card" id="hq-add-repo">
                <span class="qc-icon" data-icon="folder"></span>
                <span>添加仓库<span class="qc-desc">把目录作为笔记仓库</span></span>
              </button>
            </div>
          </header>

          <section class="home-section">
            <div class="home-sec-head">
              <h2><span data-icon="books"></span>我的仓库 <span class="home-sec-count" id="repo-count"></span></h2>
              <div class="home-sec-spacer"></div>
              <div class="view-toggle" id="repo-view-toggle">
                <button data-view="card" title="卡片视图" data-icon="grid"></button>
                <button data-view="list" title="列表视图" data-icon="listView"></button>
              </div>
            </div>
            <div id="repo-container" class="repo-grid"></div>
            <div class="home-empty" id="repo-empty" style="display:none">
              还没有仓库。仓库是你的笔记目录，添加后可在首页一键切换。<br />
              <button class="btn btn-primary" id="repo-empty-add">添加第一个仓库</button>
            </div>
          </section>

          <section class="home-section">
            <div class="home-sec-head">
              <h2><span data-icon="clock"></span>最近打开</h2>
              <div class="home-sec-spacer"></div>
              <button class="btn btn-ghost" id="home-clear-recent">清空</button>
            </div>
            <div id="home-recent" class="home-recent"></div>
            <div class="home-empty" id="home-recent-empty" style="display:none">最近打开的文件和文件夹会显示在这里</div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- 斜杠菜单 -->
  <div id="slash-menu"></div>

  <!-- 文件树右键菜单（重命名/移动/删除等真实文件操作） -->
  <div id="tree-menu"></div>

  <!-- 拖放提示 -->
  <div id="drop-hint"><div class="inner">松开以打开 Markdown 文件或文件夹</div></div>

  <!-- Toast 堆叠容器 -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- 命令面板：快速打开 / 命令 / 仓库搜索 -->
  <div id="palette-mask">
    <div id="palette">
      <div class="pal-head">
        <span id="pal-icon"></span>
        <input id="pal-input" spellcheck="false" autocomplete="off" />
        <span id="pal-hint"></span>
      </div>
      <div id="pal-list"></div>
      <div id="pal-empty" style="display:none">没有匹配</div>
      <div id="pal-foot">↑↓ 选择 · Enter 打开 · Esc 关闭</div>
    </div>
  </div>

  <!-- 弹窗挂载点 -->
  <div class="modal-mask" id="settings-mask"></div>
  <div class="modal-mask" id="welcome-mask"></div>
  <!-- 后端桥等待遮罩：js_api 注入偶发迟到时给出可视反馈与重载出口（app.js showBackendPending） -->
  <div class="modal-mask" id="backend-pending">
    <div class="modal" style="width:340px;text-align:center;padding:28px 24px">
      <p style="margin:0 0 6px">正在连接后端…</p>
      <p style="margin:0 0 14px;font-size:12px;color:var(--text-muted,#8aa)">首次或计算机繁忙时可能需要几秒钟</p>
      <button class="btn" id="backend-reload" hidden>仍无法连接？点击重新加载</button>
    </div>
  </div>
  <div class="modal-mask" id="home-modal-mask"></div>
  <div class="modal-mask" id="input-modal-mask"></div>
  <div class="modal-mask" id="confirm-mask"></div>

  <script src="vendor/vditor/dist/index.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/slash.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/welcome.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/home.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
